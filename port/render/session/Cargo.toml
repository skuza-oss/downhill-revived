# A P2P room's coordinator (finding 180): src/coordinator.rs, used by dhd_net (the native games)
# and, built as a wasm cdylib by port/tools/rustgs.py --crate dhd_session, by the browser page
# (src/browser.rs, port/web/www/p2p.js). Plain data in and out: no sockets, no platform code.
[package]
name = "dhd_session"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
