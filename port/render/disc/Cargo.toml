# The disc image's online check (finding 098): one implementation for the game and the launcher.
# A member of the renderer's workspace, inside its folder so cargo names its sources by relative
# paths (no build folder in the library). Linked into dhd_render's static library (its `native`
# feature: the game has one Rust static library) and a path dependency of port/launcher. Its one
# dependency, ring (SHA-256), is the one rustls already brings to both, so neither lock grows.
# The browser's module (src/web.rs; rustgs.py build --target wasm32-unknown-unknown --crate dhd_disc,
# finding 122) is the same crate built on its own.
[package]
name = "dhd_disc"
version = "1.0.0"
edition = "2021"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "The disc image's game files hash for online races (ISO 9660), and its cache"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ring = { version = "=0.17.14", default-features = false }

# The browser's module only: ring's getrandom 0.2 has no source of random bytes on
# wasm32-unknown-unknown and refuses to build there unless given one. The hash needs none, so the
# module registers one that always fails (src/web.rs). "custom" adds no crate: getrandom is already
# in both locks, through ring.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.2.17", default-features = false, features = ["custom"] }
