name: Announce release on Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (e.g. v0.7.9)
        required: true
      dry_run:
        description: Only print the message, don't post it
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  announce:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Post summary
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,tagName,body,url \
            | python3 .github/scripts/discord_release.py $DRY_RUN
